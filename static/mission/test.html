<!DOCTYPE html>
<html>
<head>
    <title>Mission Control</title>
    <style>
        body { font-family: Arial; background: #0a0e14; color: #e8f0f8; padding: 20px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav button { padding: 10px 20px; background: #1a2332; color: #7a8fa6; border: none; cursor: pointer; }
        .nav button.active { background: #00d4ff; color: #000; }
        .view { display: none; }
        .view.active { display: block; }
        #calendar { background: #111820; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>MISSION CONTROL</h1>
    <div class="nav">
        <button class="active" onclick="showView('team')">Team</button>
        <button onclick="showView('calendar')">Calendar</button>
        <button onclick="showView('office')">Office</button>
    </div>
    
    <div id="team-view" class="view active">
        <h2>Team View</h2>
        <p>Claudia - Active</p>
    </div>
    
    <div id="calendar-view" class="view">
        <h2>Calendar</h2>
        <div id="calendar">Loading...</div>
    </div>
    
    <div id="office-view" class="view">
        <h2>Office</h2>
    </div>

    <script>
        function showView(name) {
            document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
            event.target.classList.add('active');
            document.getElementById(name + '-view').classList.add('active');
            if (name === 'calendar') loadCalendar();
        }
        
        function loadCalendar() {
            console.log('Loading calendar...');
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/cron/jobs.json');
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    document.getElementById('calendar').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    document.getElementById('calendar').innerHTML = 'Error: ' + xhr.status;
                }
            };
            xhr.onerror = function() {
                document.getElementById('calendar').innerHTML = 'Network error';
            };
            xhr.send();
        }
    </script>
</body>
</html>
